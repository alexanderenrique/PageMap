; Waveshare ESP32-S3-Touch-LCD-7 (800x480)
; ESP-IDF framework via PlatformIO

[platformio]
default_envs = waveshare_lcd7
src_dir = main
boards_dir = boards
description = PageMap — ESP32 portable document reader

[env:waveshare_lcd7]
platform = espressif32
framework = espidf
board = waveshare_esp32s3_touch_lcd_7

board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

build_flags =
  -DCORE_DEBUG_LEVEL=3

; Uncomment / adjust if auto-detect fails:
; upload_port = /dev/cu.usbserial-*
; monitor_port = /dev/cu.usbserial-*

[env:waveshare_lcd7_debug]
extends = env:waveshare_lcd7
build_type = debug
build_flags =
  ${env:waveshare_lcd7.build_flags}
  -DCONFIG_ESP_READER_DEBUG_OVERLAY=1
